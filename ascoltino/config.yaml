name: "Ascoltino"
description: "Telegram bot that transcribes voice messages locally (Parakeet or Whisper)"
version: "1.4.1"
slug: "ascoltino"
url: "https://github.com/soldatigabriele/ascoltino"
init: true
arch:
  - aarch64
  - amd64
image: ghcr.io/soldatigabriele/ascoltino-{arch}
map:
  - type: data
    read_only: false
# Models are re-downloaded on demand; keeping them out saves several GB per backup.
backup_exclude:
  - ".cache/**"
options:
  bot_token: ""
  model: "parakeet"
  language: "en"
  beam_size: 1
  vad_filter: false
  threads: 0
  show_footer: true
  bot_name: ""
  admin_chat_id: ""
  allowed_chat_ids: ""
schema:
  bot_token: password
  model: "list(parakeet|tiny|base|small|medium|turbo|large-v2|large-v3)"
  language: str
  beam_size: "int(1,10)"
  vad_filter: bool
  threads: "int(0,16)"
  show_footer: bool
  bot_name: "str?"
  admin_chat_id: "str?"
  allowed_chat_ids: "str?"
